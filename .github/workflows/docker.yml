name: Build Online V2 Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/backend-integration

permissions:
  contents: read
  packages: write

concurrency:
  group: onlinev2-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check release tag is available
        shell: bash
        run: |
          image=ghcr.io/silverdavids/onlinev2:0.1.5
          if result=$(docker buildx imagetools inspect "$image" 2>&1); then
            echo "::error::Release $image already exists. Choose a new version; do not overwrite it."
            exit 1
          elif [[ "$result" != *"manifest unknown"* && "$result" != *"not found"* ]]; then
            echo "$result"
            echo "::error::Could not verify release availability."
            exit 1
          fi

      - name: Build and push 0.1.5
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/silverdavids/onlinev2:0.1.5
            ghcr.io/silverdavids/onlinev2:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            NEXT_PUBLIC_API_PATH_PREFIX=api
            NEXT_PUBLIC_API_TIMEOUT_MS=20000
            NEXT_PUBLIC_API_WITH_CREDENTIALS=true
            NEXT_PUBLIC_API_DEBUG=false
            NEXT_PUBLIC_MATCHES_API_BASE_URL=https://api-games.smbet.net
            NEXT_PUBLIC_MATCHES_API_PATH=/
            NEXT_PUBLIC_LIVE_SOCKET_URL=https://socket.smbet.net
