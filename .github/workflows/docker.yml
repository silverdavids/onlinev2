name: Build SmartBet Test Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - integration/smartbet-auth
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: smartbet-test-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SmartBet test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/silverdavids/smartbetonline:test-${{ github.sha }}