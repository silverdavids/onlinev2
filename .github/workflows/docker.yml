name: Build Online V2 Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/backend-integration

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push 0.1.3
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/silverdavids/onlinev2:0.1.3
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://shop.smartbet.net
            NEXT_PUBLIC_API_PATH_PREFIX=api
            NEXT_PUBLIC_API_TIMEOUT_MS=20000
            NEXT_PUBLIC_API_WITH_CREDENTIALS=true
            NEXT_PUBLIC_API_DEBUG=false
            NEXT_PUBLIC_MATCHES_API_BASE_URL=https://api-games.smbet.net
            NEXT_PUBLIC_MATCHES_API_PATH=/
            NEXT_PUBLIC_LIVE_SOCKET_URL=https://socket.smbet.net
